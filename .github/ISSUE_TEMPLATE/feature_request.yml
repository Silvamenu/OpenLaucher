name: Ideia ou melhoria
description: Sugira uma funcionalidade nova ou uma melhoria
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina a solução?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
