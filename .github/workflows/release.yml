# Gera o instalador do launcher e o envia a um release em RASCUNHO neste repositório.
# O electron-updater dos apps instalados só enxerga releases publicados.
# Uso: atualize "version" no package.json e a seção correspondente do CHANGELOG.md (via PR),
# depois crie e envie a tag de um commit da main:  git tag v0.2.0 && git push origin v0.2.0
# Por fim, confira os arquivos do rascunho na página de Releases e clique em "Publish release".
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # criar o GitHub Release e enviar o instalador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # histórico da main para conferir a origem da tag
      - name: Conferir que a tag está na main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "A tag $GITHUB_REF_NAME não aponta para um commit da main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Sem cache no job que publica: evita envenenamento de cache por outros workflows.
          package-manager-cache: false
      # Sem scripts de instalação: nada no build precisa deles, e é a via mais comum de pacote malicioso.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Conferir versão da tag
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME diferente da versão $pkg do package.json"; exit 1; }
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
