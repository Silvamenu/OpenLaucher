# Gera o instalador do launcher e o envia a um release em RASCUNHO neste repositório.
# O electron-updater dos apps instalados só enxerga releases publicados.
# Uso: atualize "version" no package.json e a seção correspondente do CHANGELOG.md (via PR).
# Depois, de um destes dois jeitos:
#   - pelo site: aba Actions > Release > Run workflow, na branch main, informando a versão (ex.: 0.2.0).
#     O workflow cria a tag vX.Y.Z no commit atual da main;
#   - pelo terminal, a partir de um commit da main:  git tag v0.2.0 && git push origin v0.2.0
# Por fim, confira os arquivos do rascunho na página de Releases e clique em "Publish release".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar, sem o "v" (ex.: 0.2.0). Precisa ser igual à version do package.json.'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # criar a tag (execução manual), o GitHub Release e enviar o instalador
    env:
      # Push de tag: o nome da própria tag. Execução manual: "v" + versão informada.
      # Vai por variável de ambiente, nunca interpolado direto no script.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Conferir formato da versão e a branch da execução
        shell: bash
        run: |
          re='^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          [[ "$TAG" =~ $re ]] || { echo "Versão inválida: $TAG (use algo como 0.2.0)"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Rode este workflow na branch main (esta execução está em $GITHUB_REF)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # histórico da main para conferir a origem da tag
      - name: Conferir que a tag está na main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "A tag $TAG não aponta para um commit da main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Sem cache no job que publica: evita envenenamento de cache por outros workflows.
          package-manager-cache: false
      # Sem scripts de instalação: nada no build precisa deles, e é a via mais comum de pacote malicioso.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Conferir versão da tag
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$TAG" ] || { echo "Tag $TAG diferente da versão $pkg do package.json"; exit 1; }
      # Só na execução manual. A tag é criada depois das conferências e dos testes, com o GITHUB_TOKEN,
      # que não dispara de novo este workflow. Se a tag já existir neste mesmo commit (nova tentativa), segue.
      - name: Criar a tag no commit atual da main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [ -z "$existing" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            echo "Tag $TAG criada em $GITHUB_SHA"
          elif [ "$existing" = "$GITHUB_SHA" ]; then
            echo "A tag $TAG já existe neste commit; seguindo."
          else
            echo "A tag $TAG já existe em outro commit ($existing). Apague a tag ou use outra versão."; exit 1
          fi
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
